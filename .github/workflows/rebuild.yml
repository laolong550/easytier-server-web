name: Rebuild easytier-server-web (kernel upgrade)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'EasyTier official version to upgrade to, e.g. v2.6.4'
        required: true
        default: 'v2.6.4'
      base_image:
        description: 'Author upstream image (keep default)'
        required: false
        default: 'jaycq/easytier-server-web:latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download official aarch64 binaries
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          curl -sL -o /tmp/et-aarch64.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/${VER}/easytier-linux-aarch64-${VER}.zip"
          unzip -o /tmp/et-aarch64.zip -d /tmp/et-aarch64
          echo "=== aarch64 binaries ==="
          find /tmp/et-aarch64 -type f \( -name 'easytier-core' -o -name 'easytier-web-embed' -o -name 'easytier-cli' \) -exec ls -la {} +

      - name: Download official x86_64 binaries
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          curl -sL -o /tmp/et-x86_64.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/${VER}/easytier-linux-x86_64-${VER}.zip"
          unzip -o /tmp/et-x86_64.zip -d /tmp/et-x86_64
          echo "=== x86_64 binaries ==="
          find /tmp/et-x86_64 -type f \( -name 'easytier-core' -o -name 'easytier-web-embed' -o -name 'easytier-cli' \) -exec ls -la {} +

      - name: Build and push multi-platform image
        env:
          VER: ${{ github.event.inputs.version }}
          BASE: ${{ github.event.inputs.base_image }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          
          mkdir -p /tmp/ctx-aarch64/overrides
          mkdir -p /tmp/ctx-x86_64/overrides
          
          find /tmp/et-aarch64 -type f \( -name 'easytier-core' -o -name 'easytier-web-embed' -o -name 'easytier-cli' \) -exec cp {} /tmp/ctx-aarch64/overrides/ \;
          find /tmp/et-x86_64 -type f \( -name 'easytier-core' -o -name 'easytier-web-embed' -o -name 'easytier-cli' \) -exec cp {} /tmp/ctx-x86_64/overrides/ \;
          
          printf 'FROM %s\nCOPY overrides/ /usr/local/bin/\nLABEL easytier.version=%s\n' \
            "${BASE}" "${VER}" > /tmp/ctx-aarch64/Dockerfile
          docker buildx build \
            --platform linux/arm64 \
            -t ${IMAGE}:${VER}-arm64 \
            --provenance=false \
            --push \
            /tmp/ctx-aarch64
          
          printf 'FROM %s\nCOPY overrides/ /usr/local/bin/\nLABEL easytier.version=%s\n' \
            "${BASE}" "${VER}" > /tmp/ctx-x86_64/Dockerfile
          docker buildx build \
            --platform linux/amd64 \
            -t ${IMAGE}:${VER}-amd64 \
            --provenance=false \
            --push \
            /tmp/ctx-x86_64
          
          docker manifest create ${IMAGE}:${VER} \
            ${IMAGE}:${VER}-arm64 \
            ${IMAGE}:${VER}-amd64
          docker manifest push ${IMAGE}:${VER}
          
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${VER}-arm64 \
            ${IMAGE}:${VER}-amd64
          docker manifest push ${IMAGE}:latest
          
          echo "=== Published to ghcr.io ==="
          echo "Manifest: ${IMAGE}:${VER}"
          echo "Manifest: ${IMAGE}:latest"
          echo "ARM64: ${IMAGE}:${VER}-arm64"
          echo "AMD64: ${IMAGE}:${VER}-amd64"

      - name: Export images as tar
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          VER_SAFE=${VER#v}
          IMAGE="ghcr.io/${{ github.repository }}"
          
          docker pull ${IMAGE}:${VER}-arm64
          docker pull ${IMAGE}:${VER}-amd64
          
          docker save ${IMAGE}:${VER}-arm64 -o /tmp/easytier-server-web-${VER_SAFE}-arm64.tar
          docker save ${IMAGE}:${VER}-amd64 -o /tmp/easytier-server-web-${VER_SAFE}-amd64.tar
          
          ls -lh /tmp/easytier-server-web-*.tar

      - name: Create Release and upload assets
        env:
          VER: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER_SAFE=${VER#v}
          
          gh release create ${VER} \
            --title "EasyTier Server Web ${VER}" \
            --notes "Automated build from jaycq/easytier-server-web with official EasyTier ${VER} binaries" \
            /tmp/easytier-server-web-${VER_SAFE}-arm64.tar \
            /tmp/easytier-server-web-${VER_SAFE}-amd64.tar
